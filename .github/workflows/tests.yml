name: CI

on:
  push:
    branches: [main, work]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, intl, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: composer validate --strict --no-check-publish
      - run: vendor/bin/pint --test
      - run: php artisan test

  mysql:
    name: PHP 8.3 · MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hussons_test
          MYSQL_ROOT_PASSWORD: testroot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptestroot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hussons_test
      DB_USERNAME: root
      DB_PASSWORD: testroot
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, intl, pdo_mysql
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
